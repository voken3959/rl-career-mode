<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1016" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Road To Pro — Match Center</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&display=swap" />
  <link rel="stylesheet" href="match3d.css?v=19" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/"
      }
    }
  </script>
</head>
<body>
  <div id="scene"></div>

  <div id="loading" class="loading">
    <div class="loading-brand">
      <img class="loading-logo" src="assets/road-to-pro.png" alt="Road To Pro" width="2172" height="724" />
      <span class="loading-kicker">Match center</span>
    </div>
    <div class="loading-title">Getting the arena ready</div>
    <div class="loading-bar"><span></span></div>
    <div class="loading-sub">Setting up the pitch</div>
  </div>

  <header class="hud-top">
    <div class="hud-brand">
      <img class="hud-logo" src="assets/road-to-pro.png" alt="Road To Pro" width="2172" height="724" />
      <span class="hud-section">Match center</span>
    </div>

    <div class="hud-rank">
      <select id="rankSelect" class="rank-select" aria-label="Rank"></select>
    </div>

    <div class="scoreboard">
      <div class="team blue"><span class="team-name">Blue</span><span class="score" id="scoreBlue">0</span></div>
      <div class="clock-box">
        <div class="clock" id="clock">5:00</div>
        <div class="clock-label" id="matchState">Kickoff</div>
      </div>
      <div class="team orange"><span class="score" id="scoreOrange">0</span><span class="team-name">Orange</span></div>
    </div>

    <div class="hud-right">
      <div class="rank-chip" id="rankChip">Bronze</div>
      <button class="icon-btn" id="soundBtn" title="Sound on/off (M)" aria-label="Sound on or off">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" />
          <path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
          <path class="slash" d="M16 9.5l5 5M21 9.5l-5 5" />
        </svg>
      </button>
      <button class="icon-btn" id="backBtn" title="Back to career" aria-label="Back to career">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>
  </header>

  <aside class="panel panel-left">
    <div class="panel-block">
      <div class="panel-heading"><span>Camera</span><span class="panel-hint">keys 1–6, D</span></div>
      <div class="cam-grid">
        <button class="cam-btn active" data-cam="car0"><span>1</span> Blue 1</button>
        <button class="cam-btn" data-cam="car1"><span>2</span> Blue 2</button>
        <button class="cam-btn" data-cam="car2"><span>3</span> Orange 1</button>
        <button class="cam-btn" data-cam="car3"><span>4</span> Orange 2</button>
        <button class="cam-btn" data-cam="car4" hidden><span>5</span> Orange 3</button>
        <button class="cam-btn" data-cam="car5" hidden><span>6</span> Orange 3</button>
        <button class="cam-btn" data-cam="director"><span>D</span> Director</button>
      </div>
    </div>

    <div class="panel-block">
      <div class="panel-heading"><span>Mode</span></div>
      <select id="modeSelect" class="select">
        <option value="1">1v1</option>
        <option value="2" selected>2v2</option>
        <option value="3">3v3</option>
      </select>
    </div>

    <div class="panel-block">
      <div class="panel-heading"><span>Difficulty</span></div>
      <select id="skillSelect" class="select">
        <option value="bronze" selected>Bronze</option>
        <option value="silver">Silver</option>
        <option value="gold">Gold</option>
        <option value="platinum">Platinum</option>
        <option value="diamond">Diamond</option>
        <option value="champion">Champion</option>
        <option value="grandchampion">Grand Champion</option>
        <option value="ssl">Supersonic Legend</option>
        <option value="pro">Pro League</option>
      </select>
      <div class="skill-meter">
        <div class="skill-meter-fill" id="skillFill"></div>
      </div>
      <div class="skill-label" id="skillDesc">Low speed, poor accuracy, frequent whiffs.</div>
    </div>

    <div class="panel-block">
      <div class="panel-heading"><span>Stats</span></div>
      <div class="stat-list">
        <div class="stat-row"><span>Speed</span><strong id="statSpeed">—</strong></div>
        <div class="stat-row"><span>Accuracy</span><strong id="statAccuracy">—</strong></div>
        <div class="stat-row"><span>Whiff chance</span><strong id="statWhiff">—</strong></div>
        <div class="stat-row"><span>Boost</span><strong id="statBoost">33%</strong></div>
      </div>
    </div>
  </aside>

  <div class="countdown" id="countdown" aria-hidden="true"></div>

  <div class="notifications" id="notifications" aria-live="polite"></div>

  <div class="boost-hud" aria-label="Boost">
    <div class="boost-hud-top"><span>Boost</span><strong id="boostValue">33%</strong></div>
    <div class="boost-hud-track"><span id="boostFill"></span></div>
  </div>

  <div class="hud-bottom">
    <div class="controls">
      <button class="control-btn" id="playBtn">Pause</button>
      <button class="control-btn" id="replayBtn">Restart</button>
      <button class="control-btn" id="modeBtn">2v2</button>
      <button class="control-btn" id="cameraBtn">Camera · Blue 1</button>
      <button class="control-btn" id="speedBtn">Speed 1×</button>
    </div>
    <div class="hint"><kbd>Space</kbd> pause <kbd>C</kbd> camera <kbd>R</kbd> restart <kbd>M</kbd> mute</div>
  </div>

  <div class="replay-badge" id="replayBadge" hidden>
    <span class="replay-dot"></span><strong>Replay</strong>
    <button type="button" id="replaySkip">Skip</button>
  </div>

  <script type="module" src="match3d.js?v=65"></script>
  <script src="local-update.js"></script>
</body>
</html>
