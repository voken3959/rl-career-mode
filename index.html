<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1016" />
  <meta name="description" content="Road To Pro — a browser-based Rocket League career mode. Start in Bronze and fight your way to the RLCS pro league." />
  <title>Road To Pro — Career Mode</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="assets/road-to-pro.png" alt="Road To Pro" width="2172" height="724" />
      <span class="brand-tag">Career Mode</span>
    </div>
    <div class="header-stats" id="headerStats"></div>
    <button class="icon-btn" data-action="settings" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
        <circle cx="15" cy="7" r="2" />
        <circle cx="9" cy="17" r="2" />
      </svg>
    </button>
  </header>

  <nav class="tabs" id="tabs" aria-label="Main navigation">
    <button class="tab active" data-tab="dashboard">Dashboard</button>
    <button class="tab" data-tab="training">Training</button>
    <button class="tab" data-tab="matches">Matches</button>
    <button class="tab" data-tab="clubs">Clubs</button>
    <button class="tab" data-tab="leaderboard">Leaderboard</button>
    <button class="tab" data-tab="achievements">Achievements</button>
  </nav>

  <main id="app" class="app"></main>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  <script src="game.js"></script>
  <script src="local-update.js"></script>
</body>
</html>
